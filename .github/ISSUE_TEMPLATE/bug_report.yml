name: Bug report
description: Report a reproducible problem using synthetic or sanitized information.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem.

        **Do not upload private media, catalogue databases, backup files, credentials, or personal filesystem paths.** Replace sensitive values with neutral placeholders and use synthetic data wherever possible.

        Security or privacy vulnerabilities must be reported privately through the repository's Security policy, not through this form.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the package version or commit ID where the problem occurs.
      placeholder: 0.1.0rc7 or commit ID
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the Windows and Python versions where relevant.
      placeholder: Windows 11, Python 3.13.x
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest deterministic steps using synthetic data.
      placeholder: |
        1. Create a temporary synthetic catalogue...
        2. Run...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or additional context
      description: Remove private paths, media names, catalogue content, credentials, device identifiers, and personal data before pasting anything.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have removed private media, catalogue/backup data, credentials, personal paths, and other sensitive information.
          required: true
        - label: This is not a security or privacy vulnerability requiring private reporting.
          required: true
