name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python 3.13
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.17"
          cache: pip

      - name: Install project
        run: |
          python -m pip install -r requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          exit $LASTEXITCODE

      - name: Compile Python source
        run: python -m compileall -q src packaging

      - name: Run deterministic test suite
        run: |
          python -X faulthandler -u tools/diagnose_test_process.py
          $testExit = $LASTEXITCODE
          Write-Output "Test observer LASTEXITCODE=$testExit"
          exit $testExit

      - name: Preserve process-exit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-process
          path: tmp/ci-finalisation/
          retention-days: 14
