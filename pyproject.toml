[build-system]
requires = ["setuptools>=75.3.0,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-librarian"
version = "0.1.0rc7"
description = "Preservation-first personal library tooling"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Pillow>=11,<13",
    "numpy>=2.1,<3",
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
build = [
    "PyInstaller>=6.11,<7",
]

[project.scripts]
personal-librarian = "personal_librarian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
