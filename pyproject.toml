[build-system]
requires = ["setuptools>=75.3.0,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-librarian"
version = "0.1.0rc7"
description = "Preservation-first personal library tooling"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Pillow>=13.0.0,<14",
    "numpy>=2.1,<3",
    # This suite reproduces native Windows finalisation crashes with 6.12.0;
    # see docs/CI_FINALISATION_DIAGNOSTIC.md before changing this qualification.
    "PySide6==6.12.0",
]

[project.optional-dependencies]
build = [
    "PyInstaller>=6.11,<7",
]

[project.scripts]
personal-librarian = "personal_librarian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
